name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Install binaryen (pinned wasm-opt, must match local builds)
        run: |
          curl -sL -o /tmp/be.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          tar xzf /tmp/be.tar.gz -C /tmp
          echo "/tmp/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Install JS deps
        run: npm ci
      - name: Rust sanity check
        run: cargo check
      - name: Build peripheral WASM
        env:
          # Panic-location file paths ($CARGO_HOME/registry/src/... = /home/runner/...)
          # are baked into the data section; remap to a canonical prefix so the
          # artifact is machine-independent (local build must use the same flag:
          # RUSTFLAGS="--remap-path-prefix=$HOME=/build")
          RUSTFLAGS: "--remap-path-prefix=/home/runner=/build"
        run: |
          echo "=== toolchain diagnostics ==="
          rustc --version; cargo --version; wasm-pack --version
          echo "PATH=$PATH" | tr ':' '\n' | grep -n -E "binaryen|wasm" || true
          which wasm-opt && wasm-opt --version || echo "NO wasm-opt on PATH"
          ls -la /tmp/binaryen-version_132/bin/ 2>&1 | head -4
          find ~/.cache/.wasm-pack -name wasm-bindgen -o -name wasm-opt 2>/dev/null | while read f; do echo "== $f"; "$f" --version 2>&1 | head -1; done
          echo "=== building ==="
          wasm-pack build --target web 2>&1 | grep -E "found wasm-opt|Optimizing|wasm-opt" || true
          echo "=== post-build cache ==="
          find ~/.cache/.wasm-pack -name wasm-bindgen -o -name wasm-opt 2>/dev/null | while read f; do echo "== $f"; "$f" --version 2>&1 | head -1; done
      - name: site/ must mirror pkg/ (emulator.js + wasm glue + wasm code)
        run: |
          cmp pkg/emulator.js site/emulator.js
          cmp pkg/stm32_bluepill_wasm.js site/stm32_bluepill_wasm.js
          # wasm-pack downloads its own wasm-bindgen-cli; the version it picks
          # can differ between machines (CI fresh cache vs local cache), and
          # each version rewrites ABI metadata in the DATA section + trailing
          # custom sections — benign, functionally identical. The CODE section
          # is the artifact's real content: compare it byte-for-byte (catches
          # the 7040bd0 failure mode: missing/stale artifact of different
          # content). The two JS artifacts stay byte-exact.
          echo "wasm sizes: pkg=$(stat -c%s pkg/stm32_bluepill_wasm_bg.wasm) site=$(stat -c%s site/stm32_bluepill_wasm_bg.wasm)"
          md5sum pkg/stm32_bluepill_wasm_bg.wasm site/stm32_bluepill_wasm_bg.wasm
          python3 - <<'EOF'
          def sections(p):
              d = open(p, 'rb').read()
              i = 8
              out = []
              while i < len(d):
                  sid = d[i]; i += 1
                  sz = 0; sh = 0
                  while True:
                      b = d[i]; i += 1
                      sz |= (b & 0x7f) << sh; sh += 7
                      if not b & 0x80: break
                  out.append((sid, sz, i))
                  i += sz
              return d, out
          for name, path, out in (('pkg', 'pkg/stm32_bluepill_wasm_bg.wasm', '/tmp/pkg.code'),
                                  ('site', 'site/stm32_bluepill_wasm_bg.wasm', '/tmp/site.code')):
              d, secs = sections(path)
              code = next((sz, o) for (sid, sz, o) in secs if sid == 10)
              payload = d[code[1]:code[1] + code[0]]
              open(out, 'wb').write(payload)
              print(f'{name} code section: {len(payload)} bytes')
              customs = [d[o:o + sz] for (sid, sz, o) in secs if sid == 0]
              print(f'{name} custom sections:')
              for c in customs:
                  print('   ', c[:200])
              print(f'{name} code head b64: {payload[:256].hex()}')
              datas = [d[o:o + sz] for (sid, sz, o) in secs if sid == 11]
              print(f'{name} data strings:')
              for dd in datas:
                  import re
                  for s in re.findall(rb'[\x20-\x7e]{4,}', dd):
                      print('   ', s[:120])
          EOF
          echo "comparing code sections:"
          cmp /tmp/pkg.code /tmp/site.code
          echo "code sections identical"
      - name: Prepare firmware ELF + device images (committed copies live in site/)
        run: |
          cp site/arduino_periph_test.elf tests/arduino_periph_test/build/arduino_periph_test.ino.elf
          cp site/arduino_eeprom.bin tests/arduino_periph_test/build/eeprom.bin
          cp site/arduino_eeprom2.bin tests/arduino_periph_test/build/eeprom2.bin
          cp site/arduino_spi_flash.bin tests/arduino_periph_test/build/spi_flash.bin
          cp site/arduino_spi_flash2.bin tests/arduino_periph_test/build/spi_flash2.bin
      - name: Unit tests
        run: node tests/test_all.mjs
      - name: Firmware format + ESM smoke tests
        run: |
          node tests/test_firmware_formats.mjs
          node tests/test_esm.mjs
      - name: Regression canary (39/39 firmware checks)
        run: node tests/canary.mjs
      - name: Full firmware run (200M instructions, UART RX + config)
        run: echo -n "AB" | node pkg/cli.mjs --config=tests/arduino_periph_test/config.yaml --max=200000000
      - name: Emulator.js path (browser run loop) 200M firmware run
        run: node tests/test_emulator_js.mjs
      - name: WS2812 strip (SPI1 + DMA1 CH3) regression
        run: node tests/test_ws2812.mjs
      - name: STM32F1 wrapper API (ergonomic class over emulator.js)
        run: node tests/test_stm32f1_api.mjs
      - name: I2C/SPI/USART virtual-peripheral event queue
        run: node tests/test_i2c_events.mjs
      - name: TIM/ADC virtual-peripheral events (extended queue)
        run: node tests/test_extra_events.mjs
      - name: EXTI edge virtual-peripheral events (extended queue)
        run: node tests/test_exti_events.mjs
      - name: DAC/CRC/RTC/CAN virtual-peripheral events (extended queue)
        run: node tests/test_more_events.mjs
      - name: TIM input-capture event (extended queue)
        run: node tests/test_tim_capture.mjs
      - name: FSMC transaction event (extended queue)
        run: node tests/test_fsmc_events.mjs
      - name: TIM input-capture AFIO remap
        run: node tests/test_tim_remap.mjs
      - name: FSMC-backed virtual display (Wokwi-style peripheral)
        run: node tests/test_fsmc_display.mjs
      - name: I2C BUSY flag lifecycle (START/STOP/NACK)
        run: node tests/test_i2c_busy.mjs
      - name: DMA request register bits (DAC/TIM/SPI/USART)
        run: node tests/test_dma_requests.mjs
      - name: DMA signal generation + TIM slave mode + I2C clock stretching
        run: node tests/test_dma_signals.mjs
