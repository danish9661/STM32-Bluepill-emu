name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Install binaryen (pinned wasm-opt, must match local builds)
        run: |
          curl -sL -o /tmp/be.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          tar xzf /tmp/be.tar.gz -C /tmp
          echo "/tmp/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Install JS deps
        run: npm ci
      - name: Rust sanity check
        run: cargo check
      - name: Build peripheral WASM
        run: wasm-pack build --target web
      - name: site/ must mirror pkg/ (emulator.js + wasm glue + wasm)
        run: |
          cmp pkg/emulator.js site/emulator.js
          cmp pkg/stm32_bluepill_wasm.js site/stm32_bluepill_wasm.js
          # wasm-pack 0.14 runs wasm-opt (binaryen) on release builds when it
          # is on PATH, and the trailing custom sections (producers/version
          # stamps) vary with the exact toolchain — so byte-compare the
          # common prefix: the code sections must be identical, metadata and
          # wasm-opt reshaping may differ. Catches the 7040bd0 failure mode
          # (missing/stale artifact of different content).
          echo "wasm sizes: pkg=$(stat -c%s pkg/stm32_bluepill_wasm_bg.wasm) site=$(stat -c%s site/stm32_bluepill_wasm_bg.wasm)"
          a=pkg/stm32_bluepill_wasm_bg.wasm; b=site/stm32_bluepill_wasm_bg.wasm
          if [ "$(stat -c%s "$a")" -gt "$(stat -c%s "$b")" ]; then t="$a"; a="$b"; b="$t"; fi
          cmp -n "$(stat -c%s "$a")" "$a" "$b"
      - name: Prepare firmware ELF + device images (committed copies live in site/)
        run: |
          cp site/arduino_periph_test.elf tests/arduino_periph_test/build/arduino_periph_test.ino.elf
          cp site/arduino_eeprom.bin tests/arduino_periph_test/build/eeprom.bin
          cp site/arduino_eeprom2.bin tests/arduino_periph_test/build/eeprom2.bin
          cp site/arduino_spi_flash.bin tests/arduino_periph_test/build/spi_flash.bin
          cp site/arduino_spi_flash2.bin tests/arduino_periph_test/build/spi_flash2.bin
      - name: Unit tests
        run: node tests/test_all.mjs
      - name: Firmware format + ESM smoke tests
        run: |
          node tests/test_firmware_formats.mjs
          node tests/test_esm.mjs
      - name: Regression canary (39/39 firmware checks)
        run: node tests/canary.mjs
      - name: Full firmware run (200M instructions, UART RX + config)
        run: echo -n "AB" | node pkg/cli.mjs --config=tests/arduino_periph_test/config.yaml --max=200000000
      - name: Emulator.js path (browser run loop) 200M firmware run
        run: node tests/test_emulator_js.mjs
