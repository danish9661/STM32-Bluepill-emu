<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STM32F1 Emulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 16px; }
    .row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    button { background: #0ea5e9; color: #082f49; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #0284c7; color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    label { font-size: 13px; color: #94a3b8; }
    input[type="file"] { display: none; }
    label.file { background: #1e293b; color: #38bdf8; border: 1px dashed #0ea5e9; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .stats { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    .stats b { color: #38bdf8; }
    #terminal { background: #020617; border: 1px solid #334155; border-radius: 8px; height: 300px; overflow-y: auto; padding: 12px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    #terminal .out { color: #4ade80; }
    #terminal .in { color: #a5b4fc; }
    .uart-row { display: flex; gap: 8px; margin-top: 12px; }
    .uart-row input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 8px; font-family: Consolas, monospace; }
    .uart-row input:focus { outline: none; border-color: #0ea5e9; }
  </style>
</head>
<body>
  <h1>STM32F1 Emulator</h1>

  <div class="row">
    <label class="file" id="fileLabel">Load Firmware (ELF/HEX/BIN)…</label>
    <input type="file" id="firmwareInput" accept=".elf,.hex,.bin,.o">
    <button id="runBtn" disabled>Run</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="resetBtn" disabled>Reset</button>
  </div>

  <div class="stats" id="stats">Load a firmware file to start.</div>

  <div id="terminal"></div>

  <div class="uart-row">
    <input id="uartInput" placeholder="Type UART bytes to send to MCU…" disabled>
    <button id="uartSend" disabled>Send</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
